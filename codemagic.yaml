workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      vars:
        BUNDLE_ID: "com.gnaen.app"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
