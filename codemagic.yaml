workflows:
  GnaenApp Build:
    name: GnaenApp Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pods
        script: pod install --repo-update
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.gnaen.app" --type IOS_APP_STORE --create -v
          keychain add-certificates
      - name: Build IPA
        script: xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: gnaen
        submit_to_testflight: true
