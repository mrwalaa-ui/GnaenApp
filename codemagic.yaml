workflows:
  ios-release:
    name: Gnaen iOS Release
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "حط الـ Issuer ID هنا"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "6VMPRR79FM"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          حط محتوى ملف AuthKey_6VMPRR79FM.p8 هنا
          -----END PRIVATE KEY-----
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install pods
        script: pod install --repo-update
      - name: Fix Arabic name and Capabilities
        script: |
          if [ -d "جنائن.xcworkspace" ]; then mv "جنائن.xcworkspace" "App.xcworkspace"; fi
          echo "Removing Push & Associated Domains entitlements..."
          find . -name "*.entitlements" -type f | while read f; do
            echo "Fixing $f"
            plutil -remove com.apple.developer.associated-domains "$f" 2>/dev/null || true
            plutil -remove aps-environment "$f" 2>/dev/null || true
            cat "$f"
          done
          # احذف الـ capability من المشروع
          sed -i '' '/com.apple.SafariKeychain/d' جنائن.xcodeproj/project.pbxproj || true
          sed -i '' '/com.apple.Push/d' جنائن.xcodeproj/project.pbxproj || true
          sed -i '' '/com.apple.AssociatedDomains/d' جنائن.xcodeproj/project.pbxproj || true
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace App.xcworkspace --scheme جنائن
    artifacts:
      - build/ios/ipa/*.ipa
