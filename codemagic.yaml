workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gnaen.app
    scripts:
      - name: Build IPA
        script: |
          PROJECT_DIR=$(find $CM_BUILD_DIR -name "pubspec.yaml" -print -quit | xargs dirname)
          cd $PROJECT_DIR
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ipa --release --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
