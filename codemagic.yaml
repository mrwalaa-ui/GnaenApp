workflows:
  ios:
    name: GnaenApp Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix Arabic code
        script: |
          find . -name "*.swift" -type f -exec sed -i '' 's/جنائن\./self./g' {} \;
          find . -name "*.swift" -type f -exec sed -i '' 's/جنائن/self/g' {} \;
      - name: Pods
        script: |
          if [ -f "جنائن/Podfile" ]; then cd جنائن && pod install --repo-update; else pod install --repo-update; fi
      - name: Build
        script: |
          WS=$(find . -name "*.xcworkspace" | head -n 1)
          xcodebuild -workspace "$WS" -scheme "جنائن" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO PRODUCT_NAME=GnaenApp PRODUCT_MODULE_NAME=GnaenApp -derivedDataPath build/DerivedData build
      - name: IPA
        script: |
          APP=$(find build -name "*.app" -type d | head -n 1)
          mkdir -p build/Payload && rm -rf build/Payload/* && cp -r "$APP" build/Payload/ && cd build && zip -r GnaenApp-unsigned.ipa Payload
    artifacts:
      - build/*.ipa
