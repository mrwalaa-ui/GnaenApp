workflows:
  ios-workflow:
    name: Gnaen iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/GnaenApp.xcworkspace"
        XCODE_SCHEME: "GnaenApp"
        BUNDLE_ID: "com.gnaen.app"
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Expo Prebuild
        script: |
          npx expo prebuild --clean --platform ios
      - name: Install Pods
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build IPA
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
                     -scheme "$XCODE_SCHEME" \
                     -config Release \
                     -archivePath $CM_BUILD_DIR/GnaenApp.xcarchive \
                     archive
          xcodebuild -exportArchive \
                     -archivePath $CM_BUILD_DIR/GnaenApp.xcarchive \
                     -exportPath $CM_BUILD_DIR/build \
                     -exportOptionsPlist ios/ExportOptions.plist
    artifacts:
      - build/*.ipa
      - /tmp/xcodebuild_logs/*.log
