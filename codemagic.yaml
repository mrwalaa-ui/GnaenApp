workflows:
  ios-workflow:
    name: iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Pods
        script: |
          pod install --repo-update || true
      - name: Build IPA
        script: |
          #!/usr/bin/env bash
          set -e
          xcodebuild -workspace جنالن.xcworkspace -scheme جنالن -configuration Release archive -archivePath /tmp/App.xcarchive CODE_SIGN_STYLE=AUTOMATIC || xcodebuild -project جنالن.xcodeproj -scheme جنالن -configuration Release archive -archivePath /tmp/App.xcarchive CODE_SIGN_STYLE=AUTOMATIC
          xcodebuild -exportArchive -archivePath /tmp/App.xcarchive -exportPath ./build -exportOptionsPlist ExportOptions.plist
    artifacts:
      - build/*.ipa
