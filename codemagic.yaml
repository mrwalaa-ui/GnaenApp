workflows:
  ios-release:
    name: Gnaen iOS Release
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "حط الـ Issuer ID هنا"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "6VMPRR79FM"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          حط محتوى ملف AuthKey_6VMPRR79FM.p8 هنا
          -----END PRIVATE KEY-----
    scripts:
      - name: Install pods and rename
        script: |
          pod install --repo-update
          if [ -d "جنائن.xcworkspace" ]; then mv "جنائن.xcworkspace" "App.xcworkspace"; fi
          xcode-project detect-bundle-id
      - name: Setup entitlements
        script: |
          find . -name "*.entitlements" -type f -exec sh -c 'cat > "$1" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.associated-domains</key>
              <array>
                  <string>applinks:gnaen.com</string>
                  <string>applinks:www.gnaen.com</string>
              </array>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF
          ' _ {} \;
      - name: Fetch signing with Push+Domains
        script: |
          keychain initialize
          BUNDLE=$(xcode-project detect-bundle-id)
          echo "Bundle ID is $BUNDLE"
          app-store-connect fetch-signing-files "$BUNDLE" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --bundle-ids "$BUNDLE"
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace App.xcworkspace --scheme جنائن
    artifacts:
      - build/ios/ipa/*.ipa
