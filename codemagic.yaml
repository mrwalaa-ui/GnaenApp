workflows:
  ios:
    name: iOS Build
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install
        script: |
          npm install --legacy-peer-deps
      - name: Pods
        script: |
          cd ios && pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "ios/جنائن.xcworkspace" --scheme "جنائن"
    artifacts:
      - build/ios/ipa/*.ipa
