workflows:
  ios-workflow:
    name: iOS IPA Signed
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install Pods
        script: |
          pod install --repo-update || true
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          #!/usr/bin/env bash
          set -ex
          WS=$(ls -d *.xcworkspace | head -n 1)
          xcodebuild -list -workspace "$WS"
      - build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
