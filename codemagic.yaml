workflows:
  GnaenApp Build:
    name: GnaenApp Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Pods
        script: pod install --repo-update
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: gnaen
        submit_to_testflight: true
        beta_groups:
          - Beta
