workflows:
  ios-release:
    name: iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      vars:
        BUNDLE_ID: "com.gnaen.app"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build
        script: |
          cd ios
          pod install --repo-update
          cd ..
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          # يبني تلقائي بدون ما نكتب اسم عربي
          xcode-project build-ipa --config Release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
