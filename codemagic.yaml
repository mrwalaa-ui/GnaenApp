workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      vars:
        XCODE_WORKSPACE: "جنائن.xcworkspace"
        XCODE_SCHEME: "جنائن"
        BUNDLE_ID: "com.gnaen.app"
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Reset and Pods
        script: |
          git reset --hard
          pod install --repo-update
      - name: Remove Push capability safely
        script: |
          python3 << 'PY'
          import re, pathlib
          pbx = pathlib.Path("جنائن.xcodeproj/project.pbxproj")
          text = pbx.read_text(encoding='utf-8')
          # احذف بس Push
          text = re.sub(r'\s*com\.apple\.Push\s*=\s*\{[^}]+\};', '', text)
          pbx.write_text(text, encoding='utf-8')
          print("Push removed from pbxproj")

          # احذف aps-environment من entitlements
          for f in pathlib.Path(".").rglob("*.entitlements"):
              t = f.read_text(encoding='utf-8')
              t = re.sub(r'\s*<key>aps-environment</key>\s*<string>[^<]+</string>', '', t)
              f.write_text(t, encoding='utf-8')
              print(f"cleaned {f}")
          PY
      - name: Force new profile
        script: |
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
