workflows:
  ios-release:
    name: iOS PWA - Gnaen Fixed
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gnaen.app
    scripts:
      - name: Install Pods
        script: |
          pod install --repo-update
      - name: FIX Firebase deprecated API (auto-patch)
        script: |
          echo "Patching PushNotifications.swift..."
          # 1- نطفي اعتبار التحذيرات كأخطاء
          sed -i '' 's/GCC_TREAT_WARNINGS_AS_ERRORS = YES/GCC_TREAT_WARNINGS_AS_ERRORS = NO/g' جنائن.xcodeproj/project.pbxproj || true
          sed -i '' 's/SWIFT_TREAT_WARNINGS_AS_ERRORS = YES/SWIFT_TREAT_WARNINGS_AS_ERRORS = NO/g' جنائن.xcodeproj/project.pbxproj || true
          
          # 2- نصلح سطر الـ token القديم
          # نحول Messaging.messaging().token {  الى الطريقة الجديدة
          sed -i '' 's/Messaging.messaging().token { token, error in/Messaging.messaging().token(completion: { token, error in/g' جنائن/PushNotifications.swift || true
          # اذا السطر صار بة قوسين زيادة نصلحها
          sed -i '' 's/completion: { token, error in/completion: { token, error in/g' جنائن/PushNotifications.swift || true
          
          echo "Patched file:"
          sed -n '148,155p' جنائن/PushNotifications.swift
      - name: Set up signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن" --build-flag "-GCC_TREAT_WARNINGS_AS_ERRORS NO -SWIFT_TREAT_WARNINGS_AS_ERRORS NO"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
