workflows:
  ios-release:
    name: Gnaen iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      vars:
        # غير هاي السطرين فقط
        APP_STORE_CONNECT_ISSUER_ID: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "6VMPRR79FM"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MI... حط محتوى ملف AuthKey_6VMPRR79FM.p8 كامل هنا ...AQ==
          -----END PRIVATE KEY-----
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install pods
        script: |
          pod install --repo-update
      - name: Set up keychain and signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa --workspace *.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: api_key
        submit_to_testflight: false
        submit_to_app_store: false
