workflows:
  ios-workflow:
    name: iOS
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install Pods
        script: pod install --repo-update
      - name: Signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcodebuild -workspace *.xcworkspace -scheme جنائن -config Release archive -archivePath /tmp/App.xcarchive -destination generic/platform=iOS -allowProvisioningUpdates
          xcodebuild -exportArchive -archivePath /tmp/App.xcarchive -exportPath build -exportOptionsPlist <(echo '{"method":"app-store"}' | plutil -convert xml1 -o - -)
    artifacts:
      - build/*.ipa
