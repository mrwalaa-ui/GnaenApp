workflows:
  GnaenApp Build:
    name: GnaenApp Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pods
        script: pod install --repo-update
      - name: Strip all entitlements
        script: |
          python3 << 'PY'
          import pathlib, re, os
          # 1. خلي كل ملفات entitlements فارغة
          for f in pathlib.Path(".").rglob("*.entitlements"):
              print(f"Emptying {f}")
              f.write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict></dict></plist>''')
          # 2. عدل project.pbxproj
          pbx = pathlib.Path("جنائن.xcodeproj/project.pbxproj")
          if pbx.exists():
              text = pbx.read_text()
              # امسح CODE_SIGN_ENTITLEMENTS
              text = re.sub(r'CODE_SIGN_ENTITLEMENTS\s*=\s*[^;]+;', 'CODE_SIGN_ENTITLEMENTS = "";', text)
              # طفي كل SystemCapabilities
              text = re.sub(r'SystemCapabilities\s*=\s*\{[^}]*\}', 'SystemCapabilities = {\n\t\t\t\tcom.apple.Push = {\n\t\t\t\t\tenabled = 0;\n\t\t\t\t};\n\t\t\t\tcom.apple.AssociatedDomains = {\n\t\t\t\t\tenabled = 0;\n\t\t\t\t};\n\t\t\t};', text, flags=re.DOTALL)
              # تأكيد ثاني
              text = text.replace("enabled = 1;", "enabled = 0;")
              pbx.write_text(text)
              print("Patched pbxproj to remove entitlements")
          PY
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.gnaen.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: gnaen
        submit_to_testflight: true
