workflows:
  ios:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install
        script: |
          npm install
          cd ios && pod install || true
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/GnaenApp.xcworkspace --scheme GnaenApp
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
