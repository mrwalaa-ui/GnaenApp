workflows:
  gnaen-ios-unsigned:
    name: Build IPA Without Signing
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Pods
        script: |
          pod install --repo-update
      - name: Build IPA without signing
        script: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          # 1. Archive
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/Gnaen.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -sdk iphoneos

          # 2. Convert .app to .ipa
          mkdir -p build/ipa/Payload
          cp -r build/Gnaen.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          zip -r Gnaen-unsigned.ipa Payload
    artifacts:
      - build/ipa/*.ipa
      - build/Gnaen.xcarchive
