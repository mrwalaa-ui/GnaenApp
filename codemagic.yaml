workflows:
  GnaenApp Build:
    name: GnaenApp Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pods
        script: pod install --repo-update
      - name: Setup certs only
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.gnaen.app" --type IOS_APP_STORE --create
          keychain add-certificates
          python3 << 'PY'
          import pathlib, subprocess, plistlib, os
          profiles = list(pathlib.Path.home().glob("Library/MobileDevice/Provisioning Profiles/*.mobileprovision"))
          team_id = ""
          for p in profiles:
              try:
                  decoded = subprocess.check_output(["security", "cms", "-D", "-i", str(p)])
                  pl = plistlib.loads(decoded)
                  # جرب اكثر من مكان
                  if "TeamIdentifier" in pl and pl["TeamIdentifier"]:
                      team_id = pl["TeamIdentifier"][0]
                      break
                  if "Entitlements" in pl and "com.apple.developer.team-identifier" in pl["Entitlements"]:
                      team_id = pl["Entitlements"]["com.apple.developer.team-identifier"]
                      break
              except Exception as e:
                  print(f"skip {p}: {e}")
          if not team_id:
              # محاولة اخيرة من اسم البروفايل
              print("Failed to get Team ID from profile, trying App Store Connect")
              team_id = os.environ.get("CM_TEAM_ID", "")
          print(f"TEAM_ID={team_id}")
          with open(os.environ["CM_ENV"], "a") as f:
              f.write(f"TEAM_ID={team_id}\n")
          PY
          echo "Team ID is: $TEAM_ID"
      - name: Strip capabilities
        script: |
          python3 << 'PY'
          import pathlib, re
          for f in pathlib.Path(".").rglob("*.entitlements"):
              f.write_text('<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict></dict></plist>')
          pbx = pathlib.Path("جنائن.xcodeproj/project.pbxproj")
          text = pbx.read_text(encoding='utf-8')
          text = re.sub(r'CODE_SIGN_ENTITLEMENTS\s*=\s*[^;]+;', '', text)
          text = text.replace("enabled = 1;", "enabled = 0;")
          pbx.write_text(text, encoding='utf-8')
          PY
      - name: Archive with Automatic Signing
        script: |
          mkdir -p build/ios/xcarchive
          xcodebuild -workspace "جنائن.xcworkspace" \
            -scheme "جنائن" \
            -configuration Release \
            -archivePath build/ios/xcarchive/جنائن.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_ALLOW_LEGACY_KEYCHAIN=YES \
            -allowProvisioningUpdates

      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/جنائن.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: gnaen
        submit_to_testflight: true
