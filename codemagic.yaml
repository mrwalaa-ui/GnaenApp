workflows:
  ios-workflow:
    name: iOS IPA Signed
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install Pods
        script: |
          cd ios 2>/dev/null || true
          pod install --repo-update
          cd ..
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: List Schemes
        script: |
          #!/usr/bin/env bash
          set -ex
          WS=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          echo "Workspace: $WS"
          xcodebuild -list -workspace "$WS"
    artifacts:
      - build/*.ipa
      - /tmp/App.xcarchive
    publishing:
      app_store_connect:
        auth: integration
