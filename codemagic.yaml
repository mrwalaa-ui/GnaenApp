vars:
    APP_STORE_CONNECT_ISSUER_ID: "c0dd26df-97d8-43be-83be-8c93d9bb1e9e"
    APP_STORE_CONNECT_KEY_IDENTIFIER: "6VMPRR79FM"
    APP_STORE_CONNECT_PRIVATE_KEY: |
      -----BEGIN PRIVATE KEY-----
      الصق هنا محتوى ملف AuthKey_6VMPRR79FM.p8 كامل من -----BEGIN الى -----END
      بدون أي كلام ثاني جنبه
      -----END PRIVATE KEY-----
    BUNDLE_ID: "com.gnaen.app"

scripts:
    - name: Install pods and rename
      script: |
        pod install --repo-update
    - name: Fetch signing with Push+Domains
      script: |
        keychain initialize
        app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
        keychain add-certificates
        xcode-project use-profiles --bundle-ids "$BUNDLE_ID"
