workflows:
  ios-release:
    name: Gnaen iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "حط الـ Issuer ID هنا"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "6VMPRR79FM"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          حط محتوى ملف AuthKey_6VMPRR79FM.p8 كامل هنا
          -----END PRIVATE KEY-----
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install pods
        script: |
          pod install --repo-update
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace *.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
