workflows:
  ios-workflow:
    name: iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Pods
        script: |
          cd App && pod install --repo-update || true
      - name: Build IPA
        script: |
          #!/usr/bin/env bash
          set -e
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release archive -archivePath /tmp/App.xcarchive CODE_SIGN_STYLE=AUTOMATIC || xcodebuild -project App.xcodeproj -scheme App -configuration Release archive -archivePath /tmp/App.xcarchive CODE_SIGN_STYLE=AUTOMATIC
          xcodebuild -exportArchive -archivePath /tmp/App.xcarchive -exportPath ./build -exportOptionsPlist App/ExportOptions.plist
    artifacts:
      - build/*.ipa
