workflows:
  ios-release:
    name: iOS Release - Gnaen
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gnaen.app
    scripts:
      - name: Install Pods
        script: |
          pod install --repo-update

      - name: Setup signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
