workflows:
  ios-pwa:
    name: iOS PWA Build
    environment:
      vars:
        XCODE_WORKSPACE: "جنائن.xcworkspace"
        XCODE_SCHEME: "جنائن"
        BUNDLE_ID: "com.gnaen.app"
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Clean & Pods
        script: |
          git reset --hard
          pod install --repo-update
      - name: Signing with Push
        script: |
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
    artifacts:
      - build/ios/ipa/*.ipa
