workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      vars:
        BUNDLE_ID: "com.gnaen.app"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Remove Push and Domains to fix profile mismatch
        script: |
          # هذا يحذف الميزة اللي تسبب الخطأ مؤقتاً عشان البناء يعدي
          find ios -name "*.entitlements" -type f -delete || true
          # احذفها من project.pbxproj
          sed -i '' '/com.apple.developer.associated-domains/d' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' '/com.apple.developer.push/d' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' '/AssociatedDomains/d' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' '/PushNotifications/d' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' '/جنائن.xcodeproj/project.pbxproj' ios/Runner.xcodeproj/project.pbxproj || true
          find ios -name "project.pbxproj" -exec sed -i '' '/com.apple.developer.associated-domains/d' {} \; || true
          find ios -name "project.pbxproj" -exec sed -i '' '/APS/d' {} \; || true
      - name: Fetch signing files
        script: |
          keychain initialize
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
