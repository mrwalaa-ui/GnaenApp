workflows:
  ios-release:
    name: iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Find and Build
        script: |
          ls -la
          # يلقى وين pubspec.yaml
          PUB=$(find . -name "pubspec.yaml" | head -1)
          echo "Found: $PUB"
          DIR=$(dirname "$PUB")
          cd "$DIR"
          echo "Project root: $DIR"
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --platform IOS --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj
          flutter build ipa --release --export-method app-store
    artifacts:
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
