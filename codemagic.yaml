workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Build
        script: |
          cd $CM_BUILD_DIR
          PUB=$(find . -maxdepth 3 -name "pubspec.yaml" | grep -v ios | head -1)
          DIR=$(dirname "$PUB")
          echo "Project: $DIR"
          cd $CM_BUILD_DIR/$DIR
          flutter pub get
          cd ios
          pod install --repo-update
          cd $CM_BUILD_DIR/$DIR
          keychain initialize
          # يسوي شهادة جديدة اذا القديمة ما بيها private key
          app-store-connect certificates create --type IOS_DISTRIBUTION --save || true
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --platform IOS --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj
          flutter build ipa --release --export-method app-store
    artifacts:
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
