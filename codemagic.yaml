workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build
        script: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ipa --release --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
