workflows:
  ios-workflow:
    name: iOS IPA Signed
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install Pods
        script: |
          pod install --repo-update || true
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          #!/usr/bin/env bash
          set -x
          ls -la
          # لا تكتب اسم عربي - خليه يدور تلقائيا
          WS=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          echo "Found: WS=$WS PROJ=$PROJ"
          # جيب اول Scheme يلقاه
          SCHEME=$(xcodebuild -list -workspace "$WS" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | grep -v "^$" | head -n 1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | grep -v "^$" | head -n 1 | xargs)
          fi
          echo "Using Scheme: $SCHEME"
          
          # بناء الارشيف
          if [ -n "$WS" ]; then
            xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release archive -archivePath /tmp/App.xcarchive -allowProvisioningUpdates DEVELOPMENT_TEAM=TU72MDZ27R CODE_SIGN_STYLE=AUTOMATIC
          else
            xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release archive -archivePath /tmp/App.xcarchive -allowProvisioningUpdates DEVELOPMENT_TEAM=TU72MDZ27R CODE_SIGN_STYLE=AUTOMATIC
          fi
          
          # تصدير IPA
          xcodebuild -exportArchive -archivePath /tmp/App.xcarchive -exportPath ./build -exportOptionsPlist ./ExportOptions.plist
    artifacts:
      - build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
