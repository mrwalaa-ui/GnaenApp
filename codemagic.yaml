workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      vars:
        XCODE_WORKSPACE: "جنائن.xcworkspace"
        XCODE_SCHEME: "جنائن"
        BUNDLE_ID: "com.gnaen.app"
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Reset and Pods
        script: |
          git reset --hard
          pod install --repo-update
          - name: Force new profile
  script: |
    rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
    rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.p12
    echo "old profiles deleted"
            - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.gnaen.app" --type IOS_APP_STORE --create --platform IOS
          keychain add-certificates
          echo "=== Profiles fetched ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
          # اطبع شنو بيه البروفايل من مميزات
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "Checking $f"
            security cms -D -i "$f" | grep -a -A2 "com.apple.developer.associated-domains" | head
          done
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
