workflows:
  ios-workflow:
    name: GnaenApp iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "ios/GnaenApp.xcworkspace"
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install Pods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.gnaen.app --type IOS_DISTRIBUTION --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "GnaenApp"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
