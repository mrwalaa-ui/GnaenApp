workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      vars:
        BUNDLE_ID: "com.gnaen.app"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Find files and Install Pods
        script: |
          echo "--- searching ios folder ---"
          ls -la ios/ | grep -E "xcworkspace|xcodeproj"
          # يلقى اسم الـ workspace الحقيقي سواء عربي او انجليزي
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          echo "Found workspace: $WORKSPACE"
          echo "WORKSPACE=$WORKSPACE" >> $CM_ENV
          
          cd ios
          pod install --repo-update
          cd ..
      - name: Fetch signing files
        script: |
          keychain initialize
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          echo "Building workspace: $WORKSPACE"
          # يبني بدون ما نكتب الاسم العربي، يستخدم المتغير
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "جنائن" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
