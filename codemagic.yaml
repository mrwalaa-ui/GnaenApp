workflows:
  ios-release:
    name: Gnaen iOS Release
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "حط الـ Issuer ID هنا"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "6VMPRR79FM"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          حط محتوى ملف AuthKey_6VMPRR79FM.p8 هنا
          -----END PRIVATE KEY-----
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install pods
        script: |
          pod install --repo-update
      - name: Fix and List
        script: |
          ls -la
          if [ -d "جنائن.xcworkspace" ]; then mv "جنائن.xcworkspace" "App.xcworkspace"; fi
          echo "--- WORKSPACES ---"
          ls *.xcworkspace
          echo "--- SCHEMES ---"
          xcodebuild -workspace App.xcworkspace -list || true
          echo "--- PROJECTS ---"
          ls *.xcodeproj
          xcodebuild -project *.xcodeproj -list || true
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # جرب كل الـ schemes الموجودة
          xcode-project build-ipa --workspace App.xcworkspace --scheme App || \
          xcode-project build-ipa --workspace App.xcworkspace --scheme جنائن || \
          xcode-project build-ipa --workspace App.xcworkspace --scheme Gnaen
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
