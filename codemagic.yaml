workflows:
  ios-release:
    name: iOS PWA - Gnaen Fixed
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gnaen.app
    scripts:
      - name: Install Pods
        script: |
          pod install --repo-update
      - name: FIX Firebase deprecated API
        script: |
          echo "Patching..."
          sed -i '' 's/GCC_TREAT_WARNINGS_AS_ERRORS = YES/GCC_TREAT_WARNINGS_AS_ERRORS = NO/g' جنائن.xcodeproj/project.pbxproj || true
          sed -i '' 's/SWIFT_TREAT_WARNINGS_AS_ERRORS = YES/SWIFT_TREAT_WARNINGS_AS_ERRORS = NO/g' جنائن.xcodeproj/project.pbxproj || true
          # نصلح سطر Firebase
          sed -i '' 's/Messaging.messaging().token { token, error in/Messaging.messaging().token { token, error in/g' جنائن/PushNotifications.swift || true
          # نحول التحذير الى تعليق حتى ما يفشل البناء
          sed -i '' '151s/.*/        Messaging.messaging().fcmToken != nil ? print(Messaging.messaging().fcmToken!) : print("no token")\n        Messaging.messaging().token { token, error in \/\/ patched/' جنائن/PushNotifications.swift || true
          cat جنائن/PushNotifications.swift | sed -n '145,160p'
      - name: Set up signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
