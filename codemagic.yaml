workflows:
  ios-release:
    name: Gnaen iOS Release
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "حط الـ Issuer ID هنا"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "6VMPRR79FM"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          حط محتوى ملف AuthKey_6VMPRR79FM.p8 هنا
          -----END PRIVATE KEY-----
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install pods
        script: pod install --repo-update
      - name: Fix project completely
        script: |
          if [ -d "جنائن.xcworkspace" ]; then mv "جنائن.xcworkspace" "App.xcworkspace"; fi
          python3 << 'PY'
          import os, glob
          # 1. امسح كل ملفات entitlements
          for ent_file in glob.glob("**/*.entitlements", recursive=True):
              print(f"Clearing {ent_file}")
              with open(ent_file, 'w') as f:
                  f.write('''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict></dict></plist>''')
          # 2. امسح الـ capabilities من project.pbxproj
          pbx_path = "جنائن.xcodeproj/project.pbxproj"
          if os.path.exists(pbx_path):
              with open(pbx_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              # احذف كل شي يخص Push و Associated Domains
              for key in ["com.apple.Push", "com.apple.Developer.AssociatedDomains", "com.apple.SafariKeychain", "com.apple.Developer.Push"]:
                  content = content.replace(key, "")
              content = content.replace("SystemCapabilities = {", "SystemCapabilities = { /* cleaned */")
              with open(pbx_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("Cleaned pbxproj")
          PY
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace App.xcworkspace --scheme جنائن
    artifacts:
      - build/ios/ipa/*.ipa
