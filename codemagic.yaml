workflows:
  GnaenApp Build:
    name: GnaenApp Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pods
        script: pod install --repo-update
      - name: Fix capabilities
        script: |
          echo "Cleaning entitlements..."
          # امسح ملفات entitlements كلها حتى لا يطلب Associated Domains و Push
          find. -name "*.entitlements" -delete
          # امسح المرجع من project.pbxproj
          sed -i '' 's/CODE_SIGN_ENTITLEMENTS.*//g' "جنائن.xcodeproj/project.pbxproj" || true
          sed -i '' '/com.apple.developer.associated-domains/d' "جنائن.xcodeproj/project.pbxproj" || true
          sed -i '' '/SystemCapabilities/d' "جنائن.xcodeproj/project.pbxproj" || true
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.gnaen.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: gnaen
        submit_to_testflight: true
