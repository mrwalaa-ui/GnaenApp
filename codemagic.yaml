workflows:
  ios-workflow:
    name: iOS IPA Signed
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gnaen.app"
    scripts:
      - name: Install Pods
        script: |
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install --repo-update || true
          elif [ -f "Podfile" ]; then
            pod install --repo-update || true
          else
            echo "No Podfile found, skipping"
          fi
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          #!/usr/bin/env bash
          set -x
          ls -la
          if [ -d "ios" ]; then
            cd ios
          fi
          ls -la
          WS=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          echo "Workspace: $WS"
          echo "Project: $PROJ"
          
          if [ -n "$WS" ]; then
            xcodebuild -workspace "$WS" -scheme جنالن -configuration Release archive -archivePath /tmp/App.xcarchive -allowProvisioningUpdates
          else
            xcodebuild -project "$PROJ" -scheme جنالن -configuration Release archive -archivePath /tmp/App.xcarchive -allowProvisioningUpdates
          fi
          
          if [ -f "../ExportOptions.plist" ]; then
            xcodebuild -exportArchive -archivePath /tmp/App.xcarchive -exportPath ../build -exportOptionsPlist ../ExportOptions.plist
          else
            xcodebuild -export
