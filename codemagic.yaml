workflows:
  ios-pwa-workflow:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install pods if needed
        script: |
          if [ -f "Podfile" ]; then
            pod install
          elif [ -f "App/Podfile" ]; then
            cd App && pod install
          else
            echo "No Podfile found, skipping"
          fi
      - name: Build IPA
        script: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release archive -archivePath /tmp/App.xcarchive CODE_SIGN_STYLE=AUTOMATIC || xcodebuild -project App.xcodeproj -scheme App -configuration Release archive -archivePath /tmp/App.xcarchive CODE_SIGN_STYLE=AUTOMATIC
          xcodebuild -exportArchive -archivePath /tmp/App.xcarchive -exportPath ./build -exportOptionsPlist ExportOptions.plist
    artifacts:
      - build/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
