workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      vars:
        XCODE_WORKSPACE: "جنائن.xcworkspace"
        XCODE_SCHEME: "جنائن"
        BUNDLE_ID: "com.gnaen.app"
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Reset and Pods
        script: |
          git reset --hard
          pod install --repo-update
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
