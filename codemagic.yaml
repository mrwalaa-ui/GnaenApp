workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    integrations:
      app_store_connect: gnaen
    environment:
      vars:
        XCODE_WORKSPACE: "جنائن.xcworkspace"
        XCODE_SCHEME: "جنائن"
        BUNDLE_ID: "com.gnaen.app"
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Reset and Pods
        script: |
          git reset --hard
          pod install --repo-update
      - name: Nuke capabilities
        script: |
          python3 << 'PY'
          import pathlib, re
          pbx = pathlib.Path("جنائن.xcodeproj/project.pbxproj")
          s = pbx.read_text('utf-8')
          # امسح كل SystemCapabilities بلوك كامل
          s = re.sub(r'SystemCapabilities\s*=\s*\{[^}]*\n\s*\};', 'SystemCapabilities = {\n};', s, flags=re.DOTALL)
          # امسح مرجع الـ entitlements
          s = re.sub(r'CODE_SIGN_ENTITLEMENTS\s*=\s*[^;]+;', 'CODE_SIGN_ENTITLEMENTS = "";', s)
          pbx.write_text(s,'utf-8')
          print("pbx cleaned")
          for f in pathlib.Path(".").rglob("*.entitlements"):
              f.unlink()
              print(f"deleted {f}")
          # انشئ entitlements فاضي واربطه
          pathlib.Path("جنائن/جنائن.entitlements").write_text('<?xml version="1.0"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict></dict></plist>')
          PY
          # تأكيد
          cat جنائن.xcodeproj/project.pbxproj | grep -A2 SystemCapabilities | head -20
      - name: Force new profile
        script: |
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
