workflows:
  ios-app-store:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GnaenApiKey
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
    scripts:
      - name: Install CocoaPods
        script: |
          pod install --repo-update
      - name: Setup signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$(ls *.xcworkspace | head -n 1)" --scheme "$(xcode-project detect-bundle-id | rev | cut -d. -f1 | rev)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
