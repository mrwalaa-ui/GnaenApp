workflows:
  GnaenApp Build:
    name: GnaenApp Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gnaen
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pods
        script: pod install --repo-update
      - name: Force create Distribution cert
        script: |
          keychain initialize
          # هذا ينشئ شهادة Distribution جديدة ومعاها الـ private key
          app-store-connect certificates generate --type IOS_DISTRIBUTION --save --create -v || true
          app-store-connect certificates generate --type DISTRIBUTION --save --create -v || true
          ls -la $HOME/Library/MobileDevice/Certificates/ || true
      - name: Fetch profiles
        script: |
          app-store-connect fetch-signing-files "com.gnaen.app" --type IOS_APP_STORE --create -v
          keychain add-certificates
      - name: Build IPA
        script: xcode-project build-ipa --workspace "جنائن.xcworkspace" --scheme "جنائن"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: gnaen
        submit_to_testflight: true
